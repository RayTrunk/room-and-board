<!doctype html>
<!-- The inline background is deliberate: the canvas must be black from the FIRST
     BYTE. A self-update reload (the hourly version poll below) builds a brand new
     document, and until css/main.css arrives the browser paints its own default
     white — on a board that reads as the screen blanking to white and coming
     back. A background on the root element paints before any stylesheet request
     resolves, so there is nothing to flash. CSP allows inline style ATTRIBUTES
     (style-src 'unsafe-inline'), which is why this is not a <script>. Deliberately
     NOT paired with <meta name="color-scheme" content="dark">: that would also
     restyle every native control (checkboxes, time inputs) on the setup pages. -->
<html lang="en" style="background:#000">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src https: blob:; connect-src 'self' https: wss:; frame-src https://monitor.ui.com; object-src 'none'; base-uri 'none'; frame-ancestors 'none'">
<!-- The layout is a fixed 1920x1080 box (see main.css). `width=1920` keeps that
     the layout viewport; `initial-scale=1` was REMOVED 2026-07-25 because it
     pinned the zoom at 1:1 on every device, so a smaller RoomOS panel (e.g. a
     Cisco Room Navigator) showed only the top-left ~1280px and needed a
     pinch-zoom. Without it the engine fits the 1920 layout to the device width:
     a no-op on the Board Pro (device width already 1920, so scale stays 1).
     main.js fitViewport() covers the case where this meta is ignored. -->
<meta name="viewport" content="width=1920">
<title>Room &amp; Board</title>
<!-- Warm the two hosts every board talks to before the module graph has even
     parsed: the API worker (transit, markets, news, …) and Open-Meteo, which
     the Weather card in the default layout fetches browser-direct. Both are
     CORS fetches, so both hints are `crossorigin` — that is the connection
     pool the fetches will actually reuse. Third-party per-widget hosts are
     deliberately NOT listed: a preconnect a board never uses is a wasted
     socket on a stack that has few to spare. -->
<link rel="preconnect" href="https://api.roomboard.app" crossorigin>
<link rel="preconnect" href="https://api.open-meteo.com" crossorigin>
<link rel="icon" type="image/png" sizes="32x32" href="assets/room-and-board-favicon-32.png">
<link rel="apple-touch-icon" href="assets/room-and-board-icon-180.png">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
  <main id="app">
    <header id="topbar" class="topbar"></header>
    <section id="grid" class="grid" aria-live="polite"></section>
    <section id="ambient" class="ambient" hidden>
      <div id="backdrop" class="backdrop" hidden></div>
      <div id="slideshow" class="slideshow"></div>
      <div id="clockface" class="clockface" hidden></div>
      <div id="strip" class="strip"></div>
    </section>
    <section id="welcome" class="welcome" hidden></section>
    <button id="edit" class="gear gear--edit" aria-label="Edit layout"></button>
    <button id="gear" class="gear" aria-label="Settings"></button>
    <div id="settings-root"></div>
    <div id="edit-root"></div>
  </main>
  <!-- Classic script, and it MUST stay ahead of the module below: it exists to
       catch a broken/stale static import that stops main.js's module graph from
       executing at all, which a guard inside that graph could never detect. -->
  <script src="js/bootguard.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
