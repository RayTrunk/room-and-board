# Cloudflare Worker: NJT proxy + setup-code exchange + markets.
# Deploy: auto-deploys via GitHub Actions (.github/workflows/deploy-worker.yml)
# on push to main when worker/ changes; manual fallback `npm run deploy:worker`
# (= npx wrangler deploy, from worker/). Secrets:
#   npx wrangler secret put NJT_USER
#   npx wrangler secret put NJT_PASS
# Replace the KV id with your namespace: npx wrangler kv namespace create CODES
# Health-alert channel (see src/health.js) — a Slack incoming-webhook URL or an
# ntfy.sh topic URL; the monitor no-ops if unset:
#   npx wrangler secret put ALERT_WEBHOOK
# Your own Microsoft tenant for the Service Status row (see src/svcstatus.js) —
# an Entra app registration with ServiceHealth.Read.All (application) + admin
# consent. All three or none; unset, the row uses the public sources:
#   npx wrangler secret put MS_TENANT_ID
#   npx wrangler secret put MS_CLIENT_ID
#   npx wrangler secret put MS_CLIENT_SECRET
name = "signage-api"
main = "src/index.js"
compatibility_date = "2026-06-01"
routes = [
  { pattern = "api.roomboard.app", custom_domain = true },
  # New-name alias (2026-08-07): pages served from *.quadrille.io target this
  # host (see site/js/env.js). Auto-provisions DNS + cert on deploy. The old
  # rvc.tech alias was retired the same day; if the dashboard still shows
  # signage-api.rvc.tech attached, detach it there — removing a route from
  # this file does not always deprovision an existing custom domain.
  { pattern = "api.quadrille.io", custom_domain = true },
  # unsleep-origin alias (2026-08-18): pages served from *.unsleep.app or
  # *.unsleep.io target this host (see site/js/env.js). Like the others, a
  # custom domain auto-provisions its DNS record and cert on deploy. The two
  # older aliases stay: their URLs remain live.
  { pattern = "api.unsleep.app", custom_domain = true }
]

# Workers Logs: retain invocation logs (console output, exceptions, the
# cached()/notify() upstream-failure lines) so a bad deploy or an upstream
# outage is diagnosable after the fact instead of only live via `wrangler tail`.
# head_sampling_rate = 1 keeps every invocation (this worker's request volume is
# tiny). Free-plan retention applies; delete this block to opt out.
# (A table header — must sit AFTER all top-level keys like `routes` above.)
[observability]
enabled = true
head_sampling_rate = 1

# Health monitor (src/health.js): validates the key endpoints' CONTENT every
# 20 min and posts to ALERT_WEBHOOK on failure. Delete this block to turn it off
# (the /health route stays available for on-demand / external checks).
[triggers]
crons = ["*/20 * * * *"]

[[kv_namespaces]]
binding = "CODES"
id = "5e78a137e235456bb0b63b5660812bff"

# Anonymous usage heartbeat (POST /fleet — named to dodge ad-blocker lists).
# The dataset is created on first write; query it via the Analytics Engine
# SQL API (needs an account token). Self-hosters who don't want metrics can
# delete this block — the route then accepts and drops pings instead of
# erroring.
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "roomboard_usage"
